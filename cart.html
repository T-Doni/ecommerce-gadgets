<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart — NovaTech</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">
          <span class="logo-mark">◆</span>
          <span class="logo-text">NovaTech</span>
        </a>
        <nav class="primary-nav">
          <a href="index.html" class="nav-link">Catalogue</a>
          <a href="cart.html" class="nav-link active">Cart</a>
        </nav>
        <a href="cart.html" class="cart-button active" aria-label="Open cart">
          <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 6h15l-1.5 9h-12z" />
            <circle cx="9" cy="20" r="1.4" />
            <circle cx="18" cy="20" r="1.4" />
            <path d="M3 3h2l1 3" />
          </svg>
          <span class="cart-count" id="cart-count">0</span>
        </a>
      </div>
    </header>

    <main class="cart-page">
      <div class="container">
        <h1 class="page-title">Your cart</h1>

        <div class="cart-layout" id="cart-layout">
          <section class="cart-items" id="cart-items"></section>

          <aside class="cart-summary">
            <h2 class="summary-title">Order summary</h2>
            <dl class="summary-list">
              <div class="summary-row">
                <dt>Items</dt>
                <dd id="summary-items">0</dd>
              </div>
              <div class="summary-row">
                <dt>Subtotal</dt>
                <dd id="summary-subtotal">$0.00</dd>
              </div>
              <div class="summary-row summary-total">
                <dt>Total</dt>
                <dd id="summary-total">$0.00</dd>
              </div>
            </dl>
            <button type="button" id="clear-btn" class="button button-ghost button-block">Clear cart</button>
            <button type="button" class="button button-primary button-block">Checkout</button>
          </aside>
        </div>

        <div class="cart-empty" id="cart-empty" hidden>
          <h2>Your cart is empty</h2>
          <p>Browse the catalogue and add a few gadgets to get started.</p>
          <a href="index.html" class="button button-primary">Go to catalogue</a>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>© <span id="year"></span> NovaTech — Group project for Web Development I.</small>
      </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/cart-store.js"></script>
    <script src="js/header.js"></script>
    <script src="js/cart.js"></script>
  </body>
</html>
